id = "hello"
name = "Hello"
version = "0.1.0"
api = 1
description = "A small example of each kind of plugin, from the plugin recipes."

[permissions]
operations = ["scene.tree", "scene.read", "entry.read"]

[[exporters]]
format = "hello.txt"
extension = "txt"
mime = "text/plain"
label = "Hello (TXT)"

[[actions]]
name = "greet"
label = "Say hello"

[[actions]]
name = "outline"
label = "Hello outline"

[[actions]]
name = "count"
label = "Count words"
places = ["project", "scene"]

[[actions.field]]
key = "scenes"
type = "scenes"
label = "Scenes"
hint = "Leave empty for the whole story, or the scene you are in."

[[actions]]
name = "about"
label = "About a character"

[[actions.field]]
key = "who"
type = "entity"
label = "Character"
kinds = ["entry"]
entry_types = ["person"]
required = true

[[actions]]
name = "tip"
label = "Writing tip"

[[actions]]
name = "wave"
label = "Wave"

[[diagnostics]]
name = "very"
label = "Very"

[[commands]]
name = "hello"
help = "Greets each line of standard input."

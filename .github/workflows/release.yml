name: Release

# Pushing a tag such as v0.5.1 publishes the Kotlin kit and Gradle plugin to Maven Central and the Rust kit
# to crates.io, at that version, which must match the version both kits declare. Then it makes a GitHub
# release.
on:
  push:
    tags:
      - 'v*'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check the tag matches the SDK's version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^kitVersion=//p' kotlin/versions.properties)
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match kitVersion=$version in kotlin/versions.properties"
            exit 1
          fi

  maven:
    needs: [ci, version]
    runs-on: ubuntu-latest
    environment: Publish
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew --no-daemon :hammer-plugin-kit:publishAllPublicationsToMavenCentralRepository
          ./gradlew --no-daemon -p gradle-plugin publishAllPublicationsToMavenCentralRepository

  crates:
    needs: [ci, version]
    runs-on: ubuntu-latest
    environment: Publish
    # crates.io trusts this workflow through GitHub's OIDC token. Trusted publishing can't create a crate, so
    # a CARGO_REGISTRY_TOKEN secret in the Publish environment, when there is one, is used instead.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6

      # cargo publish verifies the crate by building it, for the target .cargo/config.toml names.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # A version crates.io already has, as on a rerun, is skipped rather than failing the release.
      - name: Plan the publish
        id: plan
        env:
          STORED_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if curl -sf -A "hammer-plugin-sdk release (github.com/Darkrock-Studios/hammer-plugin-sdk)" \
              "https://crates.io/api/v1/crates/hammer-plugin-kit/$version" > /dev/null; then
            echo "::notice::hammer-plugin-kit $version is already on crates.io"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$STORED_TOKEN" ]; then
            echo "stored=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.plan.outputs.skip != 'true' && steps.plan.outputs.stored != 'true'
        id: auth

      - name: Publish to crates.io
        if: steps.plan.outputs.skip != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p hammer-plugin-kit

  release:
    needs: [maven, crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hello.hammerplugin
          path: release

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release/hello.hammerplugin

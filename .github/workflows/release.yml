name: Release

# Pushing a tag such as v0.5.0 publishes the Kotlin kit and the Gradle plugin to Maven Central at that
# version, which must match kitVersion in kotlin/versions.properties, and makes a GitHub release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: Publish
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v6

      - name: Check the tag matches the SDK's version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^kitVersion=//p' versions.properties)
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match kitVersion=$version in kotlin/versions.properties"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew --no-daemon :hammer-plugin-kit:publishAllPublicationsToMavenCentralRepository
          ./gradlew --no-daemon -p gradle-plugin publishAllPublicationsToMavenCentralRepository

      - uses: actions/download-artifact@v4
        with:
          name: hello.hammerplugin
          path: kotlin/release

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: kotlin/release/hello.hammerplugin

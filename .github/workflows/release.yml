name: Release

# Pushing a tag such as v0.5.1 publishes the Kotlin kit and Gradle plugin to Maven Central and the Rust kit
# to crates.io, at that version, which must match the version both kits declare. Then it makes a GitHub
# release.
on:
  push:
    tags:
      - 'v*'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check the tag matches the SDK's version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^kitVersion=//p' kotlin/versions.properties)
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match kitVersion=$version in kotlin/versions.properties"
            exit 1
          fi

  maven:
    needs: [ci, version]
    runs-on: ubuntu-latest
    environment: Publish
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew --no-daemon :hammer-plugin-kit:publishAllPublicationsToMavenCentralRepository
          ./gradlew --no-daemon -p gradle-plugin publishAllPublicationsToMavenCentralRepository

  crates:
    needs: [ci, version]
    runs-on: ubuntu-latest
    environment: Publish
    # crates.io trusts this workflow through GitHub's OIDC token: no stored credential.
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6

      # cargo publish verifies the crate by building it, for the target .cargo/config.toml names.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p hammer-plugin-kit

  release:
    needs: [maven, crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hello.hammerplugin
          path: release

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release/hello.hammerplugin

[package]
name = "hammer-plugin-kit"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
description = "Write plugins for the Hammer editor in Rust: Hammer's imports, typed operations, and the export, action, and text check types."
license = "MIT"
repository = "https://github.com/Darkrock-Studios/hammer-plugin-sdk"
homepage = "https://hammer.ink"
readme = "README.md"
keywords = ["hammer", "plugin", "wasm", "extism", "writing"]
categories = ["wasm", "api-bindings"]

# Plugins write `use hammer::…` whatever the package is called.
[lib]
name = "hammer"

[dependencies]
serde.workspace = true
serde_json.workspace = true
getrandom = { version = "0.3", optional = true }

[features]
# getrandom's backend, from WASI's random_get, for plugins whose crates need random numbers.
getrandom = ["dep:getrandom"]
